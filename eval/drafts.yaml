# --- draft from: LlamaFirewall: An open source guardrail system for building secure AI agents (8e5ce5dcf6fc)
- id: d01
  question: "What attack success rate reduction does PromptGuard v2 86M achieve on the AgentDojo benchmark?"
  ground_truth: "PromptGuard v2 86M achieves a 57% reduction in attack success rate with negligible utility loss of 1.5%."
  expected_paper_ids: ["8e5ce5dcf6fc"]
  category: factual

- id: d02
  question: "What was the baseline attack success rate without defenses in the AgentDojo evaluation?"
  ground_truth: "The baseline without any defenses recorded an attack success rate of 17.6% and a utility of 47.7%."
  expected_paper_ids: ["8e5ce5dcf6fc"]
  category: factual

- id: d03
  question: "What attack success rate does the combined PromptGuard + AlignmentCheck configuration achieve?"
  ground_truth: "The combined PromptGuard + AlignmentCheck configuration reduces attack success rate to 1.75%, representing a greater than 90% reduction from baseline."
  expected_paper_ids: ["8e5ce5dcf6fc"]
  category: factual

# --- draft from: Auditing Agent Harness Safety (957f46e6eee0)
- id: d04
  question: "What are the three dimensions HarnessAudit uses to evaluate LLM agent execution trajectories?"
  ground_truth: "HarnessAudit audits full execution trajectories across boundary compliance, execution fidelity, and system stability."
  expected_paper_ids: ["957f46e6eee0"]
  category: factual

- id: d05
  question: "How many tasks are in HarnessAudit-Bench and across how many domains?"
  ground_truth: "HarnessAudit-Bench contains 210 tasks across eight real-world domains, instantiated in both single-agent and multi-agent configurations."
  expected_paper_ids: ["957f46e6eee0"]
  category: factual

- id: d06
  question: "What type of safety violations are most common in LLM agent harnesses according to HarnessAudit experiments?"
  ground_truth: "Resource access violations dominate the violation profile, as agents are more likely to select seemingly reasonable tools but apply them to incorrect, irrelevant, or unauthorized resources rather than invoking obviously inappropriate tools."
  expected_paper_ids: ["957f46e6eee0"]
  category: factual

# --- draft from: Invariance Makes LLM Unlearning Resilient Even to Unanticipated Downstream Fine-Tuning (11689fd83673)
- id: d07
  question: "How many unrelated examples are needed to restore most unlearned information through relearning attacks on LLMs?"
  ground_truth: "Fine-tuning on just 10 unrelated examples can restore most of the unlearned information, as demonstrated by adversarial analyses."
  expected_paper_ids: ["11689fd83673"]
  category: factual

- id: d08
  question: "What are the two widely adopted approaches for designing the forget objective in LLM unlearning?"
  ground_truth: "The two approaches are negative preference optimization (NPO), which treats forget data as negative samples, and representation misdirection for unlearning (RMU), which aligns representations of forget data with random vectors."
  expected_paper_ids: ["11689fd83673"]
  category: factual

- id: d09
  question: "What batch size and learning rate range are used for GSM8K fine-tuning in invariant LLM unlearning experiments?"
  ground_truth: "For GSM8K, a batch size of 10 is used with learning rate tuned within the range [10^-4, 10^-6], training until convergence defined as less than 1% accuracy change over two consecutive epochs."
  expected_paper_ids: ["11689fd83673"]
  category: factual

