# --- draft from: ALPHAALIGN: INCENTIVIZING SAFETY ALIGN- MENT WITH EXTREMELY SIMPLIFIED REINFORCEMENT LEARNING (f04058ae2c05)
- id: d13
  question: "What datasets are used for harmful data collection in AlphaAlign training?"
  ground_truth: "AlphaAlign uses approximately 35k harmful samples extracted from SCoT, with 5k originating from the circuit breaker dataset and the remaining 30k augmented through linguistic and contextual manipulation techniques."
  expected_paper_ids: ["f04058ae2c05"]
  category: factual

- id: d14
  question: "What is the training time for AlphaAlign on Qwen2.5-7B-Instruct compared to direct refusal and SCoT methods?"
  ground_truth: "AlphaAlign requires 70.72 hours for Qwen2.5-7B-Instruct, compared to 2.52 hours for direct refusal and 3.12 hours for SCoT."
  expected_paper_ids: ["f04058ae2c05"]
  category: factual

- id: d15
  question: "What evaluation metrics does AlphaAlign use to measure safety alignment performance?"
  ground_truth: "AlphaAlign uses attack success rate (ASR) to measure resilience against harmful and jailbreak attempts, evaluated by a refusal verifier and Llama3Guard-8B, and accuracy rate to measure over-refusal, evaluated by a refusal verifier and WildGuard."
  expected_paper_ids: ["f04058ae2c05"]
  category: factual
