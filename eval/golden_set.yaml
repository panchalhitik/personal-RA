- id: q63
  question: "Which papers discuss alignment faking?"
  ground_truth: "Two. Why Do Some Language Models Fake Alignment While Others Don't? is the dedicated study, expanding the original Claude 3 Opus demonstration to 25 models and finding only 5 with a compliance gap. Natural Emergent Misalignment from Reward Hacking in Production RL reports alignment faking as one of the behaviors that emerges when a model generalizes from learned reward hacking, alongside cooperation with malicious actors and sabotage attempts."
  expected_paper_ids: ["fa90de21f3cb", "312b50556c2c"]
  category: cross_paper
